<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncTalk x Duolingo Vibe - Requests Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }

        .btn-3d-base {
            border-radius: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            text-align: center;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            margin-bottom: 4px; 
        }

        .btn-primary { 
            background-color: #58cc02; 
            color: white; 
            box-shadow: 0 4px 0 #58a700; 
            text-shadow: 0 1px 0 rgba(0,0,0,0.15); 
        }
        .btn-primary:active { 
            transform: translateY(4px); 
            box-shadow: 0 0px 0 #58a700; 
        }
        
        .btn-secondary { 
            background-color: #e5e5e5; 
            color: #888888; 
            box-shadow: 0 4px 0 #cecece; 
        }
        .btn-secondary:active { 
            transform: translateY(4px); 
            box-shadow: 0 0px 0 #cecece; 
        }

        .card-duo {
            background-color: white;
            border: 2px solid #e5e5e5;
            border-radius: 20px;
            box-shadow: 0 4px 0 #e5e5e5;
        }

        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen overflow-hidden">

    <div class="max-w-[1400px] mx-auto flex h-full">

        <aside class="hidden md:flex flex-col w-24 lg:w-64 border-r-2 border-gray-200 bg-white p-4 pt-8 flex-shrink-0">
            <div class="mb-10 text-center lg:text-left lg:pl-4">
                <span class="text-4xl font-black text-green-500 tracking-tighter">SyncTalk</span>
            </div>
            <nav class="flex flex-col gap-2">
                <a href="discover_preview.html" class="group flex items-center justify-center lg:justify-start gap-4 p-3 lg:px-4 rounded-xl cursor-pointer text-gray-500 hover:bg-gray-100 border-2 border-transparent">
                    <div class="w-8 h-8 transition-transform duration-300 group-hover:-translate-y-1.5 text-[#1cb0f6]">
                        <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3L4 9v12h16V9l-8-6zm0 2.5l5 3.75V20h-3v-5H10v5H7v-8.75l5-3.75z"/></svg>
                    </div>
                    <span class="hidden lg:block text-lg font-bold">发现</span>
                </a>
                <a href="duolingo_preview.html" class="group flex items-center justify-center lg:justify-start gap-4 p-3 lg:px-4 rounded-xl cursor-pointer text-gray-500 hover:bg-gray-100 border-2 border-transparent">
                    <div class="w-8 h-8 transition-transform duration-300 group-hover:-translate-y-1.5 text-[#ce82ff]">
                        <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    </div>
                    <span class="hidden lg:block text-lg font-bold">好友</span>
                </a>
                <a href="chat_preview.html" class="group flex items-center justify-center lg:justify-start gap-4 p-3 lg:px-4 rounded-xl cursor-pointer text-gray-500 hover:bg-gray-100 border-2 border-transparent">
                    <div class="w-8 h-8 transition-transform duration-300 group-hover:-translate-y-1.5 text-[#1cb0f6]">
                        <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                    </div>
                    <span class="hidden lg:block text-lg font-bold">聊天</span>
                </a>
                <a href="requests_preview.html" class="group flex items-center justify-center lg:justify-start gap-4 p-3 lg:px-4 rounded-xl cursor-pointer text-[#1cb0f6] bg-[#ddf4ff] border-2 border-[#84d8ff]">
                    <div class="w-8 h-8 transition-transform duration-300 group-hover:-translate-y-1.5 text-[#1cb0f6]">
                        <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                    <span class="hidden lg:block text-lg font-bold">请求</span>
                </a>
                <a href="notifications_preview.html" class="group flex items-center justify-center lg:justify-start gap-4 p-3 lg:px-4 rounded-xl cursor-pointer text-gray-500 hover:bg-gray-100 border-2 border-transparent">
                    <div class="w-8 h-8 transition-transform duration-300 group-hover:-translate-y-1.5 text-[#58cc02]">
                        <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                    </div>
                    <span class="hidden lg:block text-lg font-bold">通知</span>
                </a>
                <a href="settings_preview.html" class="group flex items-center justify-center lg:justify-start gap-4 p-3 lg:px-4 rounded-xl cursor-pointer text-gray-500 hover:bg-gray-100 border-2 border-transparent">
                    <div class="w-8 h-8 transition-transform duration-300 group-hover:rotate-90 text-[#a5edff]">
                        <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                    </div>
                    <span class="hidden lg:block text-lg font-bold">设置</span>
                </a>
            </nav>
        </aside>

        <main class="flex-1 custom-scroll overflow-y-auto px-4 py-6 md:py-10 md:px-12 pb-24 md:pb-12 min-w-0 bg-white">
            
            <div class="max-w-5xl mx-auto">
                
                <div class="mb-10 border-b-2 border-gray-100 pb-6 flex items-end justify-between min-h-[104px]">
                    <div>
                        <h1 class="text-5xl md:text-6xl font-black text-green-500 tracking-tighter mb-4" style="text-shadow: 2px 2px 0px #46a300;">好友请求</h1>
                        <p class="text-gray-500 font-bold text-base md:text-lg">这些学习者希望能和你成为伙伴，一起练习语言！</p>
                    </div>
                    <div class="hidden md:block">
                        <div class="bg-blue-50 text-blue-600 px-4 py-2 rounded-2xl font-black border-2 border-blue-100">
                            待处理: 2
                        </div>
                    </div>
                </div>

                <!-- Search Bar Row -->
                <div class="flex flex-col md:flex-row gap-6 mb-8 items-stretch h-auto min-h-[72px] relative z-30">
                    <div class="relative flex items-center flex-1 h-14 md:h-[72px] py-[8px] z-10">
                        <svg class="absolute left-4 text-gray-400 w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="按姓名、语言搜索请求..." class="w-full h-full bg-white border-2 border-gray-200 rounded-2xl py-2 pl-12 pr-16 font-bold text-gray-600 focus:outline-none focus:border-[#1cb0f6] shadow-[0_4px_0_#e5e5e5] transition-colors text-lg">
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 menu-container">
                            <button onclick="toggleMenu('request-filter-menu', event)" class="text-[#1cb0f6] hover:text-blue-600 p-2 flex items-center justify-center">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line>
                                </svg>
                            </button>
                            <div id="request-filter-menu" class="absolute top-full right-0 mt-3 w-40 bg-white border-2 border-gray-200 rounded-2xl shadow-[0_4px_0_#e5e5e5] hidden z-40 overflow-hidden dropdown-menu text-left">
                                <div class="p-3 hover:bg-gray-100 cursor-pointer font-bold text-sm text-gray-700">最新请求</div>
                                <div class="p-3 hover:bg-gray-100 cursor-pointer font-bold text-sm text-gray-700 border-t-2 border-gray-100">最早请求</div>
                            </div>
                        </div>
                    </div>
                    <!-- Empty div to balance if needed -->
                    <div class="flex-1 h-14 md:h-[72px] py-[8px] z-10 hidden md:block"></div>
                </div>

                <!-- Requests Grid -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 mt-4 relative z-0">
                    
                    <!-- Request Card 1 -->
                    <div class="card-duo flex items-center justify-between p-4 gap-4 transition-transform hover:-translate-y-1 relative h-auto">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="w-14 h-14 rounded-xl overflow-hidden border-2 border-gray-200 flex-shrink-0 relative bg-white">
                                <img src="https://i.pravatar.cc/150?img=47" class="w-full h-full object-cover rounded-xl">
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-black text-gray-800 text-lg truncate">Lucas Silva</h4>
                                <div class="flex flex-wrap gap-2 mt-1">
                                    <span class="bg-[#ddf4ff] text-[#1cb0f6] px-2 py-0.5 rounded-xl text-[10px] font-bold border-2 border-transparent">PT</span>
                                    <span class="bg-[#e2fbc7] text-[#58cc02] px-2 py-0.5 rounded-xl text-[10px] font-bold border-2 border-transparent">ZH</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-2 h-10 flex-shrink-0">
                            <button class="btn-3d-base btn-secondary px-4 text-sm mb-0">忽略</button>
                            <button class="btn-3d-base btn-primary px-4 text-sm mb-0 flex items-center gap-1">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                接受请求
                            </button>
                        </div>
                    </div>

                    <!-- Request Card 2 -->
                    <div class="card-duo flex items-center justify-between p-4 gap-4 transition-transform hover:-translate-y-1 relative h-auto">
                        <div class="flex items-center gap-4 min-w-0">
                            <div class="w-14 h-14 rounded-xl overflow-hidden border-2 border-gray-200 flex-shrink-0 relative bg-white">
                                <img src="https://i.pravatar.cc/150?img=12" class="w-full h-full object-cover rounded-xl">
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-black text-gray-800 text-lg truncate">Yuki Tanaka</h4>
                                <div class="flex flex-wrap gap-2 mt-1">
                                    <span class="bg-[#fef08a] text-[#a16207] px-2 py-0.5 rounded-xl text-[10px] font-bold border-2 border-transparent">JA</span>
                                    <span class="bg-[#ddf4ff] text-[#1cb0f6] px-2 py-0.5 rounded-xl text-[10px] font-bold border-2 border-transparent">EN</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-2 h-10 flex-shrink-0">
                            <button class="btn-3d-base btn-secondary px-4 text-sm mb-0">忽略</button>
                            <button class="btn-3d-base btn-primary px-4 text-sm mb-0 flex items-center gap-1">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                接受请求
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleMenu(menuId, event) {
            if(event) event.stopPropagation();
            const menus = document.querySelectorAll('.dropdown-menu');
            menus.forEach(menu => {
                if (menu.id === menuId) {
                    menu.classList.toggle('hidden');
                } else {
                    menu.classList.add('hidden');
                }
            });
        }
        document.addEventListener('click', function(event) {
            if (event.target.closest('.menu-container')) return;
            const menus = document.querySelectorAll('.dropdown-menu');
            menus.forEach(menu => {
                menu.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
